<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>Podemos escrever
        um parágrafo
        de qualquer jeito.
        Basta o texto estar
        no meio do par de tags
        &lt;p&gt; e &lt;/p&gt;. <!-- LESS THAN / GREATER THAN -->
    </p>
    <p>
        Se precisar quebrar o texto 
        em algum lugar específico, 
        deve se utilizar a 
        tag  &lt;br&gt;. 
    </p>
    <p>
        Também podemos adicionar símbolos especias:
        &reg;
        &copy;

    </p>
</body>
</html>
