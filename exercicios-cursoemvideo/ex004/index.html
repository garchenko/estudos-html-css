<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Define o ícone da aba do navegador (favicon) -->
    <link rel="shortcut icon" href="favicon-01.ico" type="image/x-icon">
    <title>Teste de Favicon</title>
</head>
<body>
    <h1>Aprendendo a inserir ícone (favicon)</h1>
    <p>Olha o ícone ali em cima na aba do navegador, ao lado do título da página.</p>
    <p><strong>Tag usada:</strong> <code>&lt;link rel="shortcut icon" href="..." type="image/x-icon"&gt;</code> dentro da tag <code>&lt;head&gt;</code>.</p>
</body>
</html>
